<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Paradise Signal</title>
    <!-- Empty icon, so the browser doesn't request a missing /favicon.ico. -->
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      /* Phaser puts its <canvas> inside this element and scales it to fit (Scale.FIT). */
      #game {
        width: 100%;
        height: 100%;
      }

      /* Keep pixel art crisp when the browser scales the canvas. */
      canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
